<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7 -7 138 144" fill="none">
  <defs>
    <linearGradient id="face" x1="20" y1="10" x2="99" y2="109" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" />
      <stop offset=".48" stop-color="#fafbfc" />
      <stop offset="1" stop-color="#cbd2dc" />
    </linearGradient>
    <linearGradient id="side" x1="8" y1="20" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c5ccd6" />
      <stop offset=".45" stop-color="#858f9e" />
      <stop offset="1" stop-color="#414b59" />
    </linearGradient>
    <linearGradient id="edge" x1="10" y1="10" x2="105" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" />
      <stop offset=".6" stop-color="#e9edf4" />
      <stop offset="1" stop-color="#a4afbd" />
    </linearGradient>
    <radialGradient id="shadow">
      <stop stop-color="#000" stop-opacity=".55" />
      <stop offset="1" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <!-- Identical four-diamond geometry to the existing UTAAB mark. -->
    <g id="mark">
      <rect x="43" y="14" width="34" height="34" rx="7" transform="rotate(45 60 31)" />
      <rect x="14" y="43" width="34" height="34" rx="7" transform="rotate(45 31 60)" />
      <rect x="72" y="43" width="34" height="34" rx="7" transform="rotate(45 89 60)" />
      <rect x="43" y="72" width="34" height="34" rx="7" transform="rotate(45 60 89)" />
    </g>
  </defs>
  <ellipse cx="65" cy="119" rx="53" ry="17" fill="url(#shadow)" />
  <!-- Static extrusion and lighting: no SVG animation or runtime filters. -->
  <g fill="url(#side)" stroke="url(#side)" stroke-width=".5">
    <use href="#mark" transform="translate(3.2 8)" />
    <use href="#mark" transform="translate(2.8 7)" />
    <use href="#mark" transform="translate(2.4 6)" />
    <use href="#mark" transform="translate(2 5)" />
    <use href="#mark" transform="translate(1.6 4)" />
    <use href="#mark" transform="translate(1.2 3)" />
    <use href="#mark" transform="translate(.8 2)" />
    <use href="#mark" transform="translate(.4 1)" />
  </g>
  <use href="#mark" fill="url(#edge)" stroke="url(#edge)" stroke-width="1.1" />
  <use href="#mark" fill="url(#face)" stroke="#fff" stroke-opacity=".55" stroke-width=".3" />
</svg>
