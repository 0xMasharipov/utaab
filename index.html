  <!-- Inline critical CSS for immediate render — language-neutral skeleton -->
  <style>
    body{background:#061224;color:#fafafa;font-family:system-ui,-apple-system,sans-serif;margin:0}
    #root{min-height:100vh}
    .lcp-placeholder{position:fixed;top:0;left:0;width:100%;height:100vh;background:#061224;display:flex;align-items:center;z-index:0;transition:opacity .3s ease-out;pointer-events:none}
    .lcp-placeholder.fade-out{opacity:0}
    .lcp-skeleton{padding:0 2rem;max-width:560px;width:100%;display:flex;flex-direction:column;gap:1rem}
    .lcp-bar{height:clamp(36px,6vw,72px);border-radius:8px;background:linear-gradient(90deg,rgba(127,179,255,.06) 0%,rgba(127,179,255,.16) 50%,rgba(127,179,255,.06) 100%);background-size:200% 100%;animation:lcp-shimmer 1.6s ease-in-out infinite}
    .lcp-bar.short{width:62%;height:clamp(20px,2.5vw,28px);margin-top:.5rem}
    .lcp-bar.tiny{width:42%;height:clamp(16px,2vw,22px)}
    .lcp-buttons{display:flex;gap:.75rem;margin-top:1.5rem}
    .lcp-btn{height:44px;width:140px;border-radius:9999px;background:linear-gradient(90deg,rgba(127,179,255,.08) 0%,rgba(127,179,255,.20) 50%,rgba(127,179,255,.08) 100%);background-size:200% 100%;animation:lcp-shimmer 1.6s ease-in-out infinite}
    @keyframes lcp-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    @media (max-width:640px){
      .lcp-placeholder{align-items:flex-start;padding-top:25vh}
      .lcp-skeleton{padding:0 1.25rem;max-width:320px;gap:.75rem}
      .lcp-bar{height:clamp(28px,7vw,40px);border-radius:6px}
      .lcp-bar.short{height:clamp(16px,3.5vw,20px);width:70%}
      .lcp-bar.tiny{height:clamp(12px,3vw,16px);width:48%}
      .lcp-buttons{margin-top:1rem;gap:.5rem}
      .lcp-btn{height:40px;width:108px}
    }
    @media (prefers-reduced-motion: reduce){.lcp-bar,.lcp-btn{animation:none}}
  </style>

  <body>
    <div id="root"></div>
    <div class="lcp-placeholder" aria-hidden="true">
      <div class="lcp-skeleton">
        <div class="lcp-bar tiny"></div>
        <div class="lcp-bar"></div>
        <div class="lcp-bar short"></div>
        <div class="lcp-buttons"><div class="lcp-btn"></div><div class="lcp-btn"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Wait until the actual hero section paints, then fade the skeleton out smoothly.
      (function(){
        var root = document.getElementById('root');
        if (!root) return;
        var removed = false;
        var fade = function(){
          if (removed) return;
          var ph = document.querySelector('.lcp-placeholder');
          if (!ph) return;
          removed = true;
          ph.classList.add('fade-out');
          setTimeout(function(){ ph && ph.parentNode && ph.parentNode.removeChild(ph); }, 320);
        };
        var obs = new MutationObserver(function(){
          if (document.getElementById('hero')) { obs.disconnect(); fade(); }
        });
        obs.observe(root, { childList: true, subtree: true });
        // Safety net in case hero id changes
        setTimeout(function(){ obs.disconnect(); fade(); }, 5000);
      })();
    </script>
  </body>
